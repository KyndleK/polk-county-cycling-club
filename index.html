<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polk County Cycling Club</title>
  <meta name="description" content="Polk County Cycling Club (PoCo) — community cycling in Bolivar, MO and the Frisco Highline Trail." />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --fg: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--fg);
      padding: 2rem;
    }
    main {
      max-width: 36rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      margin: 0 0 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 1rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      margin-bottom: 1.25rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      border: 1px solid #334155;
      color: var(--accent);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">Coming soon</div>
    <h1>Polk County Cycling Club</h1>
    <p>
      Community cycling in Bolivar, MO — rides, trails, and the Frisco Highline Trail.
      This placeholder will be replaced by the real site once design and prototype land.
    </p>
    <p>PoCo · Bolivar, Missouri</p>
  </main>
</body>
</html>
