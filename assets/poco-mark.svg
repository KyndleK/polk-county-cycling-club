<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-labelledby="title desc">
  <title id="title">PoCo Cycling</title>
  <desc id="desc">PoCo script wordmark with bicycle chainring as the letter O, Cycling in serif below</desc>
  <!-- Script PoCo -->
  <text x="8" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic" font-weight="700" fill="#111" letter-spacing="-2">P</text>
  <!-- Chainring O -->
  <g transform="translate(78, 42)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#111" stroke-width="5"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#111" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#111"/>
    <!-- teeth -->
    <g stroke="#111" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-34" x2="0" y2="-40"/>
      <line x1="17" y1="-29.4" x2="20" y2="-34.6"/>
      <line x1="29.4" y1="-17" x2="34.6" y2="-20"/>
      <line x1="34" y1="0" x2="40" y2="0"/>
      <line x1="29.4" y1="17" x2="34.6" y2="20"/>
      <line x1="17" y1="29.4" x2="20" y2="34.6"/>
      <line x1="0" y1="34" x2="0" y2="40"/>
      <line x1="-17" y1="29.4" x2="-20" y2="34.6"/>
      <line x1="-29.4" y1="17" x2="-34.6" y2="20"/>
      <line x1="-34" y1="0" x2="-40" y2="0"/>
      <line x1="-29.4" y1="-17" x2="-34.6" y2="-20"/>
      <line x1="-17" y1="-29.4" x2="-20" y2="-34.6"/>
    </g>
    <!-- spokes -->
    <g stroke="#111" stroke-width="1.5" opacity="0.85">
      <line x1="0" y1="-22" x2="0" y2="22"/>
      <line x1="-22" y1="0" x2="22" y2="0"/>
      <line x1="-15.5" y1="-15.5" x2="15.5" y2="15.5"/>
      <line x1="15.5" y1="-15.5" x2="-15.5" y2="15.5"/>
    </g>
  </g>
  <text x="128" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic" font-weight="700" fill="#111" letter-spacing="-2">C</text>
  <text x="178" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic" font-weight="700" fill="#111" letter-spacing="-1">o</text>
  <!-- Cycling serif -->
  <text x="12" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#111" letter-spacing="8">CYCLING</text>
</svg>
